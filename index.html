<script id="library" type="application/json">[{"title":"Pecahan: setengah dan seperempat","lang":"id","cat":"math","lvl":"L2 · 1/2","fig":"frac","ex":"1 kue ÷ 2 sama besar = 1/2 per bagian","text":["Pecahan adalah bagian dari satu benda utuh.","Potong satu kue menjadi 2 bagian sama besar. Tiap bagian disebut setengah. Kita menulisnya 1/2.","Potong satu kue menjadi 4 bagian sama besar. Tiap bagian disebut seperempat. Kita menulisnya 1/4.","Dua seperempat sama dengan satu setengah."],"q":[{"q":"Kamu memotong kue menjadi 2 bagian sama besar. Satu bagian disebut apa?","c":["Seperempat","Setengah","Satu utuh"],"a":1,"h":"Setengah berarti 2 bagian sama besar."},{"q":"Potongan kue mana yang lebih besar?","c":["1/2","1/4","Sama besar"],"a":0,"h":"Kue yang dipotong 4 punya potongan lebih kecil daripada kue yang dipotong 2."},{"q":"Berapa seperempat yang sama dengan setengah?","c":["1","4","2"],"a":2,"h":"Seperempat adalah 1 dari 4 bagian. Setengah adalah 2 dari 4 bagian itu."},{"q":"Ada 8 mangga. Kamu mengambil setengahnya. Berapa mangga yang kamu ambil?","c":["2","4","6"],"a":1,"type":"inp","h":"Setengah berarti 2 kelompok sama banyak. 8 mangga menjadi 2 kelompok berisi 4."}],"g":[["utuh","lengkap, tidak ada bagian yang hilang"],["sama besar","ukurannya sama"]]},{"title":"TaRL Numeracy Diagnostic","lang":"en","cat":"diag","lvl":"TaRL L1–L4","fig":"div","ex":"Step check: add (8+5) -> subtract (42-17) -> share (12÷3) -> word problem (24÷4)","text":["This short check places learners across four numeracy steps: addition, subtraction, equal sharing, and division word problems.","Try every step on your own first. Use the hint if a step feels stuck, then finish the retry at the end."],"q":[{"q":"Step 1 (Add): What is 8 + 5?","c":["12","13","14"],"a":1,"h":"Count on 5 from 8: 9, 10, 11, 12, 13."},{"q":"Step 2 (Subtract): What is 42 - 17?","c":["25","35","31"],"a":0,"h":"Take away 10 first (32), then take away 7 more."},{"q":"Step 3 (Share): 12 mangoes are shared equally among 3 chi <script>
// Plain ES5 on purpose: must run on old phone browsers. No dependencies.
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// A lesson is {title, lang, text:[paragraphs], q:[{q, c:[answers], a:index of right answer, h:hint}]}.
// A draft is the same thing as the editor holds it: untrimmed, with the paragraphs in one string (body).
// Optional g:[[word, meaning]] = words the learner can tap for a plain meaning.
function fromLesson(L){
  var D={title:L.title,lang:L.lang,cat:L.cat||'',lvl:L.lvl||'',fig:L.fig||'',ex:L.ex||'',body:L.text.join('\n\n'),
    gloss:(L.g||[]).map(function(p){return p.join(' = ');}).join('\n'),
    q:L.q.map(function(q){return {q:q.q,c:q.c.slice(),a:q.a,h:q.h,type:q.type||''};})};
  return D;
}
function toLesson(D){
  var L={title:D.title.trim(),lang:D.lang,
    text:D.body.split(/\n\s*\n/).map(function(p){return p.trim().replace(/\s+/g,' ');}).filter(function(p){return p;}),
    q:D.q.map(function(q){var o={q:q.q.trim(),c:q.c.map(function(s){return s.trim();}),a:q.a,h:q.h.trim()};if(q.type=='inp')o.type='inp';return o;})},g=[];
  if(D.cat)L.cat=D.cat;
  if((D.lvl||'').trim())L.lvl=D.lvl.trim();
  if(D.fig)L.fig=D.fig;
  if((D.ex||'').trim())L.ex=D.ex.trim();
  (D.gloss||'').split(/\r?\n/).forEach(function(s){
    var i=s.indexOf('='),w=s.slice(0,i).trim(),m=s.slice(i+1).trim();
    if(i>0&&w&&m)g.push([w,m]);
  });
  if(g.length)L.g=g;
  return L;
}
// Paragraph as HTML, with the first use of each glossary word turned into a button.
function rich(s,L){
  var h=String(s),g=L.g||[],i,w='A-Za-z\\u00C0-\\u024F\\u0600-\\u06FF\\u0900-\\u097F\\u0980-\\u09FF';
  for(i=0;i<g.length;i++)h=h.replace(
    new RegExp('(^|[^'+w+'])('+g[i][0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?!['+w+'])','i'),
    '$1\u0001'+i+'\u0002$2\u0003'); // match raw text before esc() so HTML entities are never matched; tags inserted last
  return '<span lang="'+esc(L.lang)+'"'+(L.lang=='ar'?' dir="rtl"':'')+'>'+esc(h).replace(/\u0001(\d+)\u0002/g,'<button type="button" class="term" data-act="term" data-n="$1">').replace(/\u0003/g,'</button>')+'</span>';
}
function topWrong(r,i){ // index of the most common wrong first pick for question i, or -1
  var w=r.wrong[i],top=-1,k;
  for(k in w)if(top<0||w[k]>w[top])top=k;
  return +top;
}
// Returns a list of [messageKey, questionNumber]. Empty list = lesson is ready.
function validate(L){
  var e=[],i,q;
  if(!L.title)e.push(['eTitle']);
  if(!L.q.length)e.push(['eNoQ']);
  for(i=0;i<L.q.length;i++){
    q=L.q[i];
    if(!q.q)e.push(['eQ',i+1]);
    if(q.c.length<2||q.c.length>9||q.c.indexOf('')>=0)e.push(['eCh',i+1]);
    if(q.a<0||q.a>=q.c.length)e.push(['eOne',i+1]);
  }
  return e;
}

// Result code = lesson id + one digit per question (the answer picked FIRST, 1 = first choice) + check digit.
// The first pick tells the teacher which mistake to address, not only that there was one.
// Short enough to write on paper or send by SMS. Holds no learner identity.
function canon(L){
  var o=[L.title,L.lang].concat(L.text),i,j;
  for(i=0;i<L.q.length;i++){
    o.push('?'+L.q[i].q);
    for(j=0;j<L.q[i].c.length;j++)o.push((j==L.q[i].a?'*':'-')+L.q[i].c[j]);
    o.push('!'+L.q[i].h);
  }
  return o.join('\n');
}
function lessonId(L){
  var s=canon(L),h=0;
  for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%676;
  return String.fromCharCode(65+Math.floor(h/26),65+h%26);
}
// ponytail: weighted mod-10 check, misses some typos (e.g. position 10). Swap for Luhn/Damm if codes get long.
function checkDigit(d){
  var t=0;
  for(var i=0;i<d.length;i++)t+=(+d.charAt(i))*(i+1);
  return t%10;
}
function makeCode(L,picks){var d=picks.join('');return lessonId(L)+'-'+d+'-'+checkDigit(d);}
// Returns array of first picks (1-based), or 'wbad' | 'wother' | 'wtypo'.
// Bare digits with no lesson id and no check digit are accepted: that is what a paper worksheet gives.
function readCode(L,s){
  s=s.toUpperCase().replace(/[^A-Z0-9]/g,''); // hyphens and spaces optional: codes get copied by hand
  var m=/^([A-Z]{2})(\d+)(\d)$/.exec(s),d=m?m[2]:s,n=L.q.length,sum,t=0,i;
  if(!m&&!/^\d+$/.test(s))return 'wbad';
  // Paper check: the learner adds the answer numbers and writes the total after them ("2 1 3 2 = 8").
  if(!m&&d.length>n){sum=+d.slice(n);d=d.slice(0,n);}
  if((m&&m[1]!=lessonId(L))||d.length!=n)return 'wother';
  if(m&&checkDigit(d)!=+m[3])return 'wtypo';
  for(i=0;i<n;i++){
    if(+d.charAt(i)<1||+d.charAt(i)>L.q[i].c.length)return 'wtypo';
    t+=+d.charAt(i);
  }
  if(sum!==undefined&&sum!=t)return 'wtypo';
  return d.split('').map(Number);
}
// first[j] = learners right on first pick; wrong[j][choice] = learners whose first pick was that wrong choice.
function tally(L,text){
  var r={n:0,first:[],wrong:[],bad:[],learners:[]},lines=text.split(/\r?\n/),i,j,right;
  for(i=0;i<L.q.length;i++){r.first.push(0);r.wrong.push({});}
  for(i=0;i<lines.length;i++){
    if(!lines[i].trim())continue;
    var c=readCode(L,lines[i]);
    if(typeof c=='string'){r.bad.push([lines[i].trim(),c]);continue;}
    r.n++;right=0;
    for(j=0;j<c.length;j++){
      var a=c[j]-1;
      if(a==L.q[j].a){r.first[j]++;right++;}else r.wrong[j][a]=(r.wrong[j][a]||0)+1;
    }
    r.learners.push({code:lines[i].trim(),ok:right,n:L.q.length});
  }
  return r;
}
function matchInp(q,raw){
  var s=String(raw||'').trim().toLowerCase(),i,ok=q.c[q.a].trim().toLowerCase(),n=function(x){return x.replace(/[\s,]+/g,'');};
  if(!s)return -1;
  for(i=0;i<q.c.length;i++)if(n(q.c[i].trim().toLowerCase())==n(s))return i;
  return n(s)==n(ok)?q.a:-2;
}
function tarlBand(ok,n){
  var p=n?ok/n*100:0;
  return p>=80?'lvl4':p>=50?'lvl3':p>=25?'lvl2':'lvl1';
}
function packLesson(L){
  var j=JSON.stringify(L),b=unescape(encodeURIComponent(j));
  return 'TITIP1:'+btoa(b);
}
function unpackLesson(s){
  var m=String(s||'').trim();
  if(m.indexOf('TITIP1:')!==0)return null;
  try{
    var d=JSON.parse(decodeURIComponent(escape(atob(m.slice(7).replace(/\s+/g,'')))));
    return d&&d.title&&d.q&&d.q.length?d:null;
  }catch(e){return null;}
}
function fracInfo(n,d){
  var dd=(d==2||d==4||d==8)?d:2,nn=Math.max(1,Math.min(dd,+n||1));
  return {n:nn,d:dd,pct:Math.round(nn/dd*100),half:nn*2==dd,qtr:nn*4==dd};
}
function deckOf(L){
  var o=[],g=L.g||[],i,q;
  for(i=0;i<g.length;i++)o.push({kind:'g',front:g[i][0],back:g[i][1]});
  for(i=0;i<(L.q||[]).length;i++){q=L.q[i];o.push({kind:'q',front:q.q,back:q.c[q.a]+(q.h?' \u2014 '+q.h:'')});}
  return o;
}
// Share of all first picks that were right, 0 to 100.
function classPct(r){
  var s=0,i;
  for(i=0;i<r.first.length;i++)s+=r.first[i];
  return r.n&&r.first.length?Math.round(s/(r.n*r.first.length)*100):0;
}
// Practice order: every question once, then the ones missed on the first pick come back once more.
// Repeated retrieval is what the research supports (RESEARCH.md, P3).
function withRetries(L,picks){
  var o=[],i;
  for(i=0;i<L.q.length;i++)o.push(i);
  for(i=0;i<L.q.length;i++)if(picks[i]-1!=L.q[i].a)o.push(i);
  return o;
}

function selfTest(){
  function ok(c,m){if(!c)throw new Error('selfTest: '+m);}
  var L={title:'T',lang:'id',text:['A B','C'],q:[{q:'Q1',c:['x','y'],a:1,h:'h'},{q:'Q2',c:['a','b'],a:0,h:''}]};
  ok(!validate(L).length,'valid lesson has no errors');
  ok(validate({title:'',lang:'en',text:[],q:[]}).join('|')=='eTitle|eNoQ','empty lesson');
  ok(validate({title:'T',lang:'en',text:[],q:[{q:'Q',c:['a',''],a:-1,h:''}]}).join('|')=='eCh,1|eOne,1','blank answer, no right answer');
  ok(validate({title:'T',lang:'en',text:[],q:[{q:'',c:['a'],a:0,h:''}]}).join('|')=='eQ,1|eCh,1','blank question, one answer');
  ok(JSON.stringify(toLesson(fromLesson(L)))==JSON.stringify(L),'draft round trip');
  ok(toLesson({title:' T ',lang:'en',body:'a\nb\n\n\n c ',q:[]}).text.join('|')=='a b|c','paragraphs');
  ok(lessonId(L)!=lessonId(toLesson({title:'T',lang:'id',body:'A B\n\nC',q:[{q:'Q1',c:['y','x'],a:1,h:'h'},{q:'Q2',c:['a','b'],a:0,h:''}]})),'id changes with content');
  var code=makeCode(L,[2,2]); // Q1 right (y), Q2 wrong (b)
  ok(readCode(L,' '+code.toLowerCase().replace(/-/g,' ')+' ').join()=='2,2','code round trip');
  ok(readCode(L,code.replace('22','21'))=='wtypo','typo caught');
  ok(readCode(L,'ZZ-22-6')=='wother'||lessonId(L)=='ZZ','other lesson');
  ok(readCode(L,'hello')=='wbad','junk');
  ok(readCode(L,'2 1').join()=='2,1','paper answers');
  ok(readCode(L,'31')=='wtypo','answer number out of range');
  ok(readCode(L,'2')=='wother','too few answers');
  ok(readCode(L,'2 1 = 3').join()=='2,1','paper answers with total');
  ok(readCode(L,'2 2 = 3')=='wtypo','paper total catches a miscopied answer');
  var r=tally(L,code+'\n\n21\nxx');
  ok(r.n==2&&r.first.join()=='2,1'&&r.wrong[1][1]==1&&r.bad.length==1,'tally');
  ok(classPct(r)==75&&classPct(tally(L,''))==0,'class percentage');
  ok(topWrong(r,1)==1&&topWrong(r,0)==-1,'most common wrong answer');
  var G=toLesson({title:'T',lang:'en',body:'x',gloss:'half = one of two\nbad line\n = no word\nequal parts=same size',q:[]});
  ok(JSON.stringify(G.g)=='[["half","one of two"],["equal parts","same size"]]'&&fromLesson(G).gloss=='half = one of two\nequal parts = same size','glossary round trip');
  ok(rich('Half of a <b>, halfway, 2 equal parts.',G)=='<span lang="en"><button type="button" class="term" data-act="term" data-n="0">Half</button> of a &lt;b&gt;, halfway, 2 <button type="button" class="term" data-act="term" data-n="1">equal parts</button>.</span>','glossary words become buttons');
  var GH=toLesson({title:'H',lang:'hi',body:'x',gloss:'पानी = जल',q:[]});
  ok(rich('साफ़ पानी पीना पानीदार नहीं',GH).indexOf('data-n="0">पानी</button> पीना पानीदार')>0,'hindi glossary boundary');
  var GB=toLesson({title:'B',lang:'bn',body:'x',gloss:'ভগ্নাংশ = অংশ',q:[]});
  ok(rich('ভগ্নাংশ কী',GB).indexOf('data-n="0">ভগ্নাংশ</button>')>0,'bengali glossary');
  var GA=toLesson({title:'A',lang:'ar',body:'x',gloss:'الجذور = الجزء',q:[]});
  ok(rich('تمتص الجذور الماء',GA)=='<span lang="ar" dir="rtl">تمتص <button type="button" class="term" data-act="term" data-n="0">الجذور</button> الماء</span>','arabic rtl glossary');
  ok(rich('a & b',{lang:'en',g:[['amp','x']]})=='<span lang="en">a &amp; b</span>','glossary skips HTML entities');
  ok(withRetries(L,[2,2]).join()=='0,1,1'&&withRetries(L,[2,1]).join()=='0,1','missed questions come back once');
  ok(r.learners.length==2&&r.learners[0].ok==1&&r.learners[1].ok==2,'tally keeps learner scores');
  var Q={c:['2','4','6'],a:1,type:'inp'};
  ok(matchInp(Q,' 4 ')==1&&matchInp(Q,'5')==-2&&matchInp(Q,'')==-1,'matchInp matches choice, marks unknown wrong, flags empty');
  ok(tarlBand(0,4)=='lvl1'&&tarlBand(1,4)=='lvl2'&&tarlBand(2,4)=='lvl3'&&tarlBand(4,4)=='lvl4','tarlBand');
  var P=packLesson(L);ok(P.indexOf('TITIP1:')===0&&unpackLesson(P).title=='T'&&unpackLesson('bad')===null,'pack/unpack lesson');
  ok(fracInfo(2,4).half===true&&fracInfo(1,4).qtr===true&&fracInfo(1,2).pct==50,'fracInfo equivalence');
  ok(deckOf(G).length===2&&deckOf(L).length===2,'deckOf builds glossary + question flashcards');
  return 'ok';
}

w1:'personas viven bajo cobertura móvil sin usar internet móvil (38% de brecha de uso), más ~300 millones sin cobertura (~3,4 mil millones sin conexión).',
w2:'de niñas y niños en edad escolar en África Subsahariana (95% O/C, 88% E/S) y Asia del Sur (88%), más 49% en América Latina y el Caribe, no tenían internet en casa (2020).',
w3:'ganancia de aprendizaje entre 16.936 estudiantes en India, Kenia, Nepal, Filipinas y Uganda con tutoría dirigida por teléfono/SMS; el SMS solo no tuvo efecto [P1].',
w4:'mejora media con cuestionarios de práctica en 222 estudios escolares. Por eso cada lección incluye preguntas.',
w5:'efecto de la retroalimentación que explica frente a decir solo bien o mal. Por eso hay una pista tras un error.',
w6:'del alumnado de primaria en países africanos muestreados alcanza lectura mínima, junto con 23,4% en escuelas públicas rurales de 3.º en India [N55].',
wEx:'Persisten brechas internas: en Perú rural solo 20,5%–23,6% de menores de 6–17 años usa internet frente a 58,9%–60,1% nacional [N56]; en Indonesia el 27,74% de primaria no lo usa [N44]; en Brasil el acceso escolar bajó de 51% a 37% [N58].',

w2:'des enfants d’âge scolaire en Afrique subsaharienne (95 % O/C, 88 % E/S) et en Asie du Sud (88 %), et 49 % en Amérique latine/Caraïbes, n’avaient pas internet à la maison (2020).',
w3:'gain moyen parmi 16 936 élèves en Inde, au Kenya, au Népal, aux Philippines et en Ouganda grâce au tutorat ciblé par téléphone/SMS ; le SMS seul n’a eu aucun effet [P1].',

w1:'pessoas vivem sob cobertura móvel sem usar internet móvel (38% de lacuna de uso), mais ~300 milhões sem cobertura (~3,4 bilhões offline).',

function go(s){
  var i;
  if(canSpeak)speechSynthesis.cancel();
  if(s<0){picks=[];order=[];tried={};savedQ=false;lab.mode='read';for(i=0;i<lesson.q.length;i++){picks.push(0);order.push(i);}}
  else lab.mode='quiz';
  if(s==lesson.q.length&&order.length==s)order=withRetries(lesson,picks); // end of the first pass: queue the missed ones
  step=s;
  showLearn();
  $('learn').querySelector('h2').focus();
}
function answer(){
  var qi=order[step],q=lesson.q[qi],inp=$('inpA'),r=$('learn').querySelector('input:checked'),fb=$('fb'),i;
  if(inp){
    var idx=matchInp(q,inp.value);
    if(idx==-1){fb.className='fb';fb.textContent=t('pick');return;}
    if(!picks[qi])picks[qi]=(idx>=0?idx:(q.a+1)%q.c.length)+1;
    if(idx==q.a){
      fb.className='fb ok';fb.textContent='\u2713 '+t('right')+(q.h?' '+q.h:'');
      inp.disabled=true;$('chk').hidden=true;$('next').hidden=false;$('next').focus();
    }else{
      tried[qi]=1;showLearn();
      $('fb').className='fb no';$('fb').textContent='\u2717 '+t('wrong')+(q.h?' '+t('hint')+' '+q.h:'');
      var fr=$('learn').querySelector('input');if(fr)fr.focus();
    }
    return;
  }
  if(!r){fb.className='fb';fb.textContent=t('pick');return;}
  if(!picks[qi])picks[qi]=+r.value+1; // only the very first pick is kept
  if(+r.value==q.a){
    fb.className='fb ok';fb.textContent='\u2713 '+t('right')+(q.h?' '+q.h:'');
    var all=$('learn').querySelectorAll('input');
    for(i=0;i<all.length;i++)all[i].disabled=true;
    r.parentNode.className='opt ok';
    $('chk').hidden=true;$('next').hidden=false;$('next').focus();
  }else{
    r.checked=false;r.disabled=true;r.parentNode.className='opt no'; // a wrong answer cannot be picked twice
    fb.className='fb no';fb.textContent='\u2717 '+t('wrong')+(q.h?' '+t('hint')+' '+q.h:'');
  }
}
function speak(){
  if(speechSynthesis.speaking){speechSynthesis.cancel();return;}
  var q=lesson.q[order[step]],u=new SpeechSynthesisUtterance(step<0?lesson.title+'. '+lesson.text.join(' '):q.q+'. '+q.c.join('. '));
  u.lang=lesson.lang;speechSynthesis.speak(u);
}

function sheet(L,twoUp){ // paper worksheet for a household with no phone; answers come back as plain numbers
  var slip='<h1>'+c(L.title,L)+'</h1>',i,j;
  if(L.ex)slip+='<p><strong>'+t('exL')+':</strong> '+c(L.ex,L)+'</p>';
  for(i=0;i<L.text.length;i++)slip+='<p>'+c(L.text[i],L)+'</p>';
  if(L.g){slip+='<p><strong>'+t('words')+'</strong></p><ul>';for(i=0;i<L.g.length;i++)slip+='<li>'+c(L.g[i][0]+' = '+L.g[i][1],L)+'</li>';slip+='</ul>';}
  slip+='<p><strong>'+t('pHow')+'</strong></p><ol>';
  for(i=0;i<L.q.length;i++){
    slip+='<li>'+c(L.q[i].q,L)+'<ol>';
    for(j=0;j<L.q[i].c.length;j++)slip+='<li>'+c(L.q[i].c[j],L)+'</li>';
    slip+='</ol></li>';
  }
  slip+='</ol><p>'+t('pAns')+' ____________________</p><p>'+t('pSum')+' ______</p>';
  if(!twoUp){
    slip+='<p>'+t('pKey')+'</p><ol class="key">';
    for(i=0;i<L.q.length;i++)slip+='<li>'+(L.q[i].a+1)+(L.q[i].h?'. '+c(L.q[i].h,L):'')+'</li>'; // printed upside down: feedback without a phone
    slip+='</ol>';
  }
  $('sheet').innerHTML=twoUp?'<div class="slips"><div class="slip">'+slip+'</div><div class="slip">'+slip+'</div></div>':slip;
  window.print();
}

function view(v,quiet){
  var ids=['home','learn','lib','make','res','why','help'],b=document.querySelectorAll('nav button'),i;
  if(ids.indexOf(v)<0)v='home';
  cur=v;
  for(i=0;i<ids.length;i++)$(ids[i]).hidden=ids[i]!=v;
  for(i=0;i<b.length;i++){if(b[i].getAttribute('data-v')==v)b[i].setAttribute('aria-current','page');else b[i].removeAttribute('aria-current');}
  try{if(location.hash.replace(/^#\/?/,'')!=v)history.replaceState(null,'','#/'+v);}catch(e){}
  window.scrollTo(0,0);
  if(!quiet)$(v).querySelector('h2').focus();
}
function applyLang(){
  document.documentElement.lang=ui;
  document.documentElement.dir=(ui=='ar'?'rtl':'ltr');
  var e=document.querySelectorAll('[data-t]'),i;
  for(i=0;i<e.length;i++)e[i].textContent=t(e[i].getAttribute('data-t'));
  e=document.querySelectorAll('[data-al]');
  for(i=0;i<e.length;i++)e[i].setAttribute('aria-label',t(e[i].getAttribute('data-al')));
  $('uiLang').value=ui;
  showHome();showLearn();showLib();showMake();showRes();showWhy();showHelp();
}
function setPref(k,v){ // text size, colours and language are remembered on this device
  prefs[k]=v;save('prefs',prefs);
  document.documentElement.style.fontSize=prefs.big?'125%':'';
  document.documentElement.className=prefs.dark?'dark':'';
  $('bBig').setAttribute('aria-pressed',!!prefs.big);$('bDark').setAttribute('aria-pressed',!!prefs.dark);
}
function net(){$('net').hidden=navigator.onLine!==false;}

document.addEventListener('click',function(e){
  var a=e.target;
  while(a&&a!=document&&!a.getAttribute('data-act'))a=a.parentNode;
  if(!a||a==document)return;
  var act=a.getAttribute('data-act'),qi=+a.getAttribute('data-q'),ci=+a.getAttribute('data-c'),L,q;
  if(act=='view')view(a.getAttribute('data-v'));
  else if(act=='menu')document.body.className=document.body.className?'':'mini';
  else if(act=='big')setPref('big',!prefs.big);
  else if(act=='dark')setPref('dark',!prefs.dark);
  else if(act=='term'){L=lesson.g[+a.getAttribute('data-n')];$('def').innerHTML='<strong>'+c(L[0])+'</strong>: '+c(L[1]);}
  else if(act=='saver'){
    L=lastRound();
    if(tally(lesson,L).n){q=load('rounds',[]);q.push({id:lessonId(lesson),d:new Date().getTime(),codes:L});save('rounds',q);showSaved();}
  }
  else if(act=='addr'){L=load('rounds',[])[+a.getAttribute('data-n')];q=$('codes').value.trim();$('codes').value=L.codes+(q?'\n---\n'+q:'');demo=false;/* the saved round is the earlier one, so it goes first */results();$('out').focus();}
  else if(act=='delr'){q=load('rounds',[]);q.splice(+a.getAttribute('data-n'),1);save('rounds',q);showSaved();}
  else if(act=='csv')csv();
  else if(act=='recsheet')recSheet();
  else if(act=='listen')speak();
  else if(act=='next')go(step+1);
  else if(act=='again')go(-1);
  else if(act=='labpick'){setLesson(LIB[+a.getAttribute('data-n')]);}
  else if(act=='fcut'){lab.fd=+a.getAttribute('data-v');if(lab.fn>lab.fd)lab.fn=lab.fd;refreshLab();}
  else if(act=='fnum'){lab.fn=+a.getAttribute('data-v');refreshLab();}
  else if(act=='dtot'){lab.dt=+a.getAttribute('data-v');refreshLab();}
  else if(act=='dgrp'){lab.dg=+a.getAttribute('data-v');refreshLab();}
  else if(act=='wstep'){lab.ws=+a.getAttribute('data-v');refreshLab();}
  else if(act=='pstep'){lab.ps=+a.getAttribute('data-v');refreshLab();}
  else if(act=='hstep'){var hi=+a.getAttribute('data-v');lab.hs[hi]=lab.hs[hi]?0:1;refreshLab();}
  else if(act=='lmode'){var lm=a.getAttribute('data-v');if(lm=='quiz'&&step<0){go(0);return;}lab.mode=lm;if(lm=='read')step=-1;showLearn();}
  else if(act=='flip'){lab.flip=!lab.flip;showLearn();}
  else if(act=='cprev'){lab.ci--;lab.flip=false;showLearn();}
  else if(act=='cnext'){lab.ci++;lab.flip=false;showLearn();}
  else if(act=='cknow'){var dn=deckOf(lesson).length,ci=((lab.ci%dn)+dn)%dn;lab.known[ci]=!lab.known[ci];lab.ci++;lab.flip=false;showLearn();}
  else if(act=='saveq'){q=load('group.'+lessonId(lesson),[]);q.push(makeCode(lesson,picks));save('group.'+lessonId(lesson),q);savedQ=true;showLearn();}
  else if(act=='clrq'){save('group.'+lessonId(lesson),[]);savedQ=false;showLearn();}
  else if(act=='resq'){$('codes').value=load('group.'+lessonId(lesson),[]).join('\n');demo=false;view('res');results();$('out').focus();}
  else if(act=='open'){setLesson(LIB[+a.getAttribute('data-n')]);view('learn');}
  else if(act=='copy'){D=fromLesson(LIB[+a.getAttribute('data-n')]);showMake();view('make');}
  else if(act=='imp'){
    L=unpackLesson($('impTxt').value);
    if(!L||validate(L).length){$('libMsg').className='fb no';$('libMsg').textContent=t('impBad');return;}
    LIB.unshift(L);setLesson(L);view('learn');
  }
  else if(act=='tally'){results();$('out').focus();}
  else if(act=='demo'){view('res',1);$('codes').value=demoCodes();demo=true;results();$('out').focus();}
  else if(act=='follow'){ // one tap from "these questions went badly" to a lesson the teacher can hand out
    D=fromLesson({title:lesson.title+' 2',lang:lesson.lang,cat:lesson.cat,lvl:lesson.lvl,fig:lesson.fig,ex:lesson.ex,text:lesson.text,q:weak.map(function(i){return lesson.q[i];})});
    showMake();view('make',1);$('fTitle').focus();
  }
  else if(act=='addq'){D.q.push({q:'',c:['',''],a:-1,h:''});showMake();$('q'+(D.q.length-1)).focus();}
  else if(act=='delq'){D.q.splice(qi,1);showMake();$('addq').focus();}
  else if(act=='addc'){D.q[qi].c.push('');showMake();$('c'+qi+'_'+(D.q[qi].c.length-1)).focus();}
  else if(act=='delc'){
    q=D.q[qi];q.c.splice(ci,1);
    q.a=q.a==ci?-1:q.a>ci?q.a-1:q.a; // keep the right-answer mark on the same answer
    showMake();$('c'+qi+'_'+Math.min(ci,q.c.length-1)).focus();
  }
  else if(act=='cpcode'){
    L=status();if(!L){$('msg').scrollIntoView();return;}
    var pc=packLesson(L);
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(pc)['catch'](function(){prompt('TITIP1',pc);});else prompt('TITIP1',pc);
    $('msg').innerHTML='<p><span class="chip good">\u2713 '+esc(t('cpOk'))+'</span></p>';
  }
  else if(act=='use'||act=='dl'||act=='share'||act=='print'||act=='print2'){
    L=status();
    if(!L){$('msg').scrollIntoView();return;}
    setLesson(L); // the draft becomes the current lesson, so Results matches what was handed out
    if(act=='print'||act=='print2')sheet(L,act=='print2');else if(act=='use')view('learn');else download(L,act=='share');
  }
});
$('learn').addEventListener('submit',function(e){e.preventDefault();answer();});
$('lib').addEventListener('change',function(e){
  if(e.target.id=='libLang'){libF.lang=e.target.value;showLib();}
  else if(e.target.id=='libCat'){libF.cat=e.target.value;showLib();}
});
$('make').addEventListener('input',edit);
$('make').addEventListener('change',edit); // radios and selects on old browsers
$('res').addEventListener('input',function(){demo=false;});
$('uiLang').addEventListener('change',function(){ui=this.value;setPref('ui',ui);applyLang();}); // typed codes are never labelled made-up
window.addEventListener('hashchange',function(){var v=location.hash.replace(/^#\/?/,'');if(v=='demo'){view('res',1);$('codes').value=demoCodes();demo=true;results();}else if(v!=cur)view(v,1);});

(function(){var e=document.querySelectorAll('[data-i]');for(var i=0;i<e.length;i++)e[i].innerHTML=ic(e[i].getAttribute('data-i'));})();
// Brand font on wide screens only, and never when the browser asks to save data. Phones keep their system font and make no outside request.
if(window.matchMedia&&matchMedia('(min-width:56em)').matches&&!(navigator.connection&&navigator.connection.saveData)){
  var lk=document.createElement('link');lk.rel='stylesheet';
  lk.href='https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&family=Google+Sans+Code:wght@400;600&display=swap';
  document.head.appendChild(lk);
}
$('pickT').textContent=lesson.title;
for(var i=0;i<lesson.q.length;i++){picks.push(0);order.push(i);}
applyLang();
if(prefs.dark==null&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)prefs.dark=true; // follow the device until the user chooses
setPref('ui',ui);
net();window.addEventListener('online',net);window.addEventListener('offline',net);
(function(){var v=location.hash.replace(/^#\/?/,'');
  if(v=='demo'){view('res',1);$('codes').value=demoCodes();demo=true;results();}
  else view(v||(handout?'learn':'home'),1);})();
// Hosted copy keeps working after the signal drops. A downloaded file needs no service worker.
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js');
</script>
